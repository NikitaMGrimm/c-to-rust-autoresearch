[workspace]
members = ["crates/*"]
# The loop agent writes the transpiler, so plain cargo commands leave it out:
# its build scripts and tests would run outside the sandbox. eval and the gate
# build it in the sandbox; CI checks it with --workspace.
default-members = ["crates/bench", "crates/eval", "crates/transcripts"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/NikitaMGrimm/c-to-rust-autoresearch"
publish = false
