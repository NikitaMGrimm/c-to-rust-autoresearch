name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install C tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 clang-tidy-18 libclang-rt-18-dev llvm-18 jq
      - name: Install Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Inspect a sample program
        run: |
          printf '#include <stdio.h>\nint main(void) { puts("ok"); return 0; }\n' > "$RUNNER_TEMP/sample.c"
          scripts/inspect "$RUNNER_TEMP/sample.c"
          cargo run -q -p transpiler -- "$RUNNER_TEMP/sample.c" -o "$RUNNER_TEMP/sample.rs"
